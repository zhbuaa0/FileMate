name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            command: npx electron-builder --mac dmg --arm64 --publish never
            files: dist/*.dmg
          - os: windows-latest
            command: npm run dist:win:portable -- --publish never
            files: dist/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: ${{ matrix.files }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          sha256sum dist/* > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "FileMate $GITHUB_REF_NAME" --notes "FileMate 首个公开版本，支持在 Windows 和 macOS 上递归批量加密、解密文件。当前安装包尚未签名，首次运行时系统可能显示安全提示。"
        env:
          GH_TOKEN: ${{ github.token }}

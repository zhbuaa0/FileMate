name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            command: npx electron-builder --mac dmg --arm64 --publish never
            files: dist/*.dmg
          - os: windows-latest
            command: npm run dist:win:portable -- --publish never
            files: dist/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Create Windows self-signed certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=FileMate" -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable -NotAfter (Get-Date).AddYears(5)
          $password = ConvertTo-SecureString "filemate" -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\filemate.pfx" -Password $password
      - run: ${{ matrix.command }}
        env:
          WIN_CSC_LINK: ${{ runner.temp }}/filemate.pfx
          WIN_CSC_KEY_PASSWORD: filemate
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: ${{ matrix.files }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          sha256sum dist/* > SHA256SUMS.txt
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          gh release upload "$GITHUB_REF_NAME" dist/* SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "FileMate $GITHUB_REF_NAME" --notes "支持在 Windows 和 macOS 上批量加密、解密文件，以及按页码范围拆分和重命名扫描 PDF。安装包使用免费自签名，首次运行时系统仍可能显示安全提示。"
        env:
          GH_TOKEN: ${{ github.token }}
